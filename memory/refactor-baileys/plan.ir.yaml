apiVersion: capability-orchestrator.io/v2
kind: CapabilityGraph
metadata:
  id: "refactor-baileys"
  ir_version: "2.0.0"
  policy_ref: high-reliability
spec:
  nodes:
    - id: spike-node-baileys
      capability: research-spike
      type: worker
      dependencies: []
      definition_of_done:
        - id: dod-spike-1
          check: "Versão real do Node.js confirmada; @whiskeysockets/baileys fixado (linha 6.7.x salvo aceite explícito de ESM/7.x com Node>=20); pino fixado (9.x ou 10.x conforme Node); qrcode-terminal e @hapi/boom resolvidos via npm view"
          verification: evidence

    - id: contract-data-layer
      capability: api-contract
      type: worker
      dependencies: [spike-node-baileys]
      definition_of_done:
        - id: dod-contract-1
          check: "docs/contracts/data-layer.md publicado com 6 assinaturas exatas (getOrCreateClient, appendHistory, getRecentHistory, getPagedHistory, getConfig, setConfig, resetAllData)"
          verification: evidence

    - id: data-config-table
      capability: data-migration
      type: worker
      dependencies: [contract-data-layer]
      definition_of_done:
        - id: dod-data-1
          check: "Tabela config criada (IF NOT EXISTS); fachada database/index.js expõe assinaturas do contrato; resetAllData preserva config"
          verification: evidence

    - id: infra-deps
      capability: dependency-management
      type: worker
      dependencies: [spike-node-baileys]
      definition_of_done:
        - id: dod-infra-1
          check: "package.json sem @wppconnect-team/wppconnect; com baileys/pino/qrcode-terminal/@hapi/boom; .gitignore contem auth/; .env.example criado"
          verification: evidence

    - id: backend-baileys-engine
      capability: backend-implementation
      type: worker
      dependencies: [spike-node-baileys, infra-deps]
      definition_of_done:
        - id: dod-be-1
          check: "useMultiFileAuthState('auth'); QR via qrcode-terminal; reconexao automatica exceto loggedOut; filtro 1:1/grupo/broadcast na origem"
          verification: evidence

    - id: backend-mutex
      capability: backend-implementation
      type: worker
      dependencies: [spike-node-baileys]
      definition_of_done:
        - id: dod-be-2
          check: "src/concurrency.js serializa mesma JID e permite paralelismo entre JIDs distintas"
          verification: test

    - id: backend-humanizer
      capability: backend-implementation
      type: worker
      dependencies: [spike-node-baileys]
      definition_of_done:
        - id: dod-be-3
          check: "simularRespostaHumana adaptado para sock.sendMessage(jid, {text})"
          verification: evidence

    - id: backend-cache-fix
      capability: backend-implementation
      type: worker
      dependencies: []
      definition_of_done:
        - id: dod-be-4
          check: "generateCacheKey inclui JID/userId; nenhuma chamada remanescente a pluginSystem.executeHook em openai.js"
          verification: test

    - id: backend-aiconfig-persist
      capability: backend-implementation
      type: worker
      dependencies: [data-config-table]
      definition_of_done:
        - id: dod-be-5
          check: "aiConfigManager hidrata de config no boot; setPersonality/setModel fazem upsert via setConfig"
          verification: test

    - id: backend-message-handler
      capability: backend-implementation
      type: worker
      dependencies: [data-config-table, backend-mutex, backend-cache-fix, backend-aiconfig-persist]
      definition_of_done:
        - id: dod-be-6
          check: "src/core/messageHandler.js: mutex -> dados -> IA -> persistencia assincrona -> release, substitui pipeline.js"
          verification: test

    - id: backend-wire-bot
      capability: backend-implementation
      type: worker
      dependencies: [backend-baileys-engine, backend-humanizer, backend-message-handler]
      definition_of_done:
        - id: dod-be-7
          check: "messages.upsert 1:1 nao-admin chama messageHandler+humanizer; MessageQueue removida de bot.js"
          verification: evidence

    - id: infra-remove-queue
      capability: cleanup
      type: worker
      dependencies: [backend-wire-bot]
      definition_of_done:
        - id: dod-infra-2
          check: "src/queue.js ausente; nenhum require('./queue') remanescente"
          verification: evidence

    - id: backend-reset-cmd
      capability: backend-implementation
      type: worker
      dependencies: [data-config-table]
      definition_of_done:
        - id: dod-be-8
          check: "/reset confirmar usa resetAllData(); config preservada"
          verification: evidence

    - id: backend-history-cmd
      capability: backend-implementation
      type: worker
      dependencies: [data-config-table]
      definition_of_done:
        - id: dod-be-9
          check: "/historico usa getPagedHistory; saida identica ao comportamento atual"
          verification: evidence

    - id: backend-backup-verify
      capability: backend-implementation
      type: worker
      dependencies: [data-config-table]
      definition_of_done:
        - id: dod-be-10
          check: "backup.js compativel com schema pos data-config-table; sem alteracao funcional necessaria"
          verification: evidence

    - id: backend-ai-cmd
      capability: backend-implementation
      type: worker
      dependencies: [backend-aiconfig-persist]
      definition_of_done:
        - id: dod-be-11
          check: "/ai sem subcomandos plugin*; register() nao recebe mais pluginSystem"
          verification: evidence

    - id: backend-admin-env
      capability: backend-implementation
      type: worker
      dependencies: [backend-baileys-engine]
      definition_of_done:
        - id: dod-be-12
          check: "ADMIN_NUMBERS lido de process.env, sem array hardcoded"
          verification: evidence

    - id: infra-remove-plugins
      capability: cleanup
      type: worker
      dependencies: [backend-baileys-engine, backend-cache-fix, backend-ai-cmd]
      definition_of_done:
        - id: dod-infra-3
          check: "src/pluginSystem.js e plugins/ ausentes; nenhuma referencia remanescente"
          verification: evidence

    - id: infra-remove-dashboard
      capability: cleanup
      type: worker
      dependencies: [backend-wire-bot]
      definition_of_done:
        - id: dod-infra-4
          check: "src/dashboard.js e src/performance.js ausentes; bot.js sem require('./performance')"
          verification: evidence

    - id: infra-remove-treinamento
      capability: cleanup
      type: worker
      dependencies: []
      definition_of_done:
        - id: dod-infra-5
          check: "src/treinamento.js ausente"
          verification: evidence

    - id: infra-logger-pino
      capability: backend-implementation
      type: worker
      dependencies: [spike-node-baileys]
      definition_of_done:
        - id: dod-infra-6
          check: "logger.js usa pino preservando API info/error/debug/api; EventEmitter/SSE removidos"
          verification: evidence

    - id: backend-remove-repos
      capability: cleanup
      type: worker
      dependencies: [backend-message-handler, backend-reset-cmd, backend-history-cmd]
      definition_of_done:
        - id: dod-be-13
          check: "src/repositories/clientsRepo.js e historyRepo.js ausentes; sem require remanescente"
          verification: evidence

    - id: backend-app-entrypoint
      capability: backend-implementation
      type: worker
      dependencies: [backend-wire-bot, backend-admin-env, infra-remove-dashboard, infra-logger-pino]
      definition_of_done:
        - id: dod-be-14
          check: "app.js sem dashboard/queue; npm start inicia sem erro de require"
          verification: evidence

    - id: docs-env-readme
      capability: documentation
      type: worker
      dependencies: [backend-app-entrypoint]
      definition_of_done:
        - id: dod-docs-1
          check: ".env.example e README.md refletem stack Baileys/pino sem mencao a dashboard/plugins/porta 3000"
          verification: evidence

    - id: test-unit-core
      capability: test-implementation
      type: worker
      dependencies: [backend-mutex, backend-cache-fix, backend-aiconfig-persist, backend-message-handler]
      definition_of_done:
        - id: dod-test-1
          check: "node --test cobre mutex, cache-key-com-JID, aiConfig persist, messageHandler; exit 0"
          verification: test

    - id: test-static-check
      capability: test-implementation
      type: worker
      dependencies: [backend-app-entrypoint]
      definition_of_done:
        - id: dod-test-2
          check: "node --check em todos os arquivos tocados retorna 0"
          verification: test

    - id: test-e2e-smoke
      capability: test-implementation
      type: worker
      dependencies: [backend-app-entrypoint, backend-admin-env, test-static-check]
      definition_of_done:
        - id: dod-test-3
          check: "Checklist E2E manual completo: QR conecta, 1:1 responde, grupo ignorado, comandos admin ok, /ai persiste apos restart"
          verification: evidence

    - id: docs-agent-history
      capability: documentation
      type: worker
      dependencies: [test-e2e-smoke]
      definition_of_done:
        - id: dod-docs-2
          check: ".agent_history.md atualizado com PLANO/DECISOES/RESULTADO/ENCERRAMENTO desta Fase 1-2"
          verification: evidence

  assumptions:
    - id: assumption-node-version
      description: "Versao real do Node.js no ambiente-alvo nao confirmada neste ambiente de planeamento (node/npm indisponiveis no shell do subagente). Assume-se piso minimo Node>=18 LTS ate confirmacao no spike-node-baileys."
      owner_node: spike-node-baileys
    - id: assumption-pipeline-rename
      description: "ARCHITECTURE.md (arvore simplificada) nao lista explicitamente onde vive a logica de negocio pos-remocao de pipeline.js. Decisao do Planner: renomear para src/core/messageHandler.js, mantendo src/core/{cache,retry}.js intactos."
      owner_node: backend-message-handler
    - id: assumption-cache-decision
      description: "PRD/ADR deixam RF-013 como 'incluir JID OU remover cache'. Decisao do Planner: manter cache, incluir JID na chave (preserva comportamento original, corrige apenas a falha de seguranca)."
      owner_node: backend-cache-fix
